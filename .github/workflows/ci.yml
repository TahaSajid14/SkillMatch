name: SkillMatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and test API
        working-directory: Asp.net/asp.net
        run: dotnet test -c Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: React/my-app/package-lock.json
      - name: Install dependencies
        working-directory: React/my-app
        run: npm ci
      - name: Lint
        working-directory: React/my-app
        run: npm run lint
      - name: Build
        working-directory: React/my-app
        run: npm run build
