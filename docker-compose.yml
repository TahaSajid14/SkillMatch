services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SKILLMATCH_SQL_PASSWORD}
    volumes:
      - skillmatch-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./Asp.net/asp.net
      dockerfile: asp.net/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=skillmatchdb;User Id=sa;Password=${SKILLMATCH_SQL_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: SkillMatch.API
      Jwt__Audience: SkillMatch.Web
      Jwt__Key: ${SKILLMATCH_JWT_KEY}
      Jwt__ExpirationMinutes: 60
      Database__MigrateOnStartup: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - skillmatch-resumes:/app/Storage/Resumes
    restart: unless-stopped

  web:
    build:
      context: ./React/my-app
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  skillmatch-sql-data:
  skillmatch-resumes:
